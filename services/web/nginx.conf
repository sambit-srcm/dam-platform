server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's built-in DNS server. Using it with a variable below makes nginx
  # look up "api" again on every request, instead of once when nginx starts -
  # which matters because the api service might not exist yet at that moment.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
